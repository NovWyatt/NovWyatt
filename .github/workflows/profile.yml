# Vẽ lại trang GitHub của NovWyatt và trang wyattos.cyou:
# - mỗi khi profile.yml (hoặc mã sinh ảnh, mã trang web) thay đổi trên nhánh main,
# - mỗi đêm lúc 01:00 giờ Việt Nam để cập nhật biểu đồ đóng góp 3D và số liệu repo,
# - hoặc bấm tay: tab Actions -> Profile -> Run workflow.
name: Profile

on:
  push:
    branches: [main]
    paths:
      - profile.yml
      - 3d-contrib.json
      - media/**
      - fonts/**
      - scripts/**
      - site/src/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/profile.yml
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Có secret này thì đăng luôn trang wyattos.cyou lên Cloudflare (xem HUONG-DAN.md).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Biểu đồ đóng góp 3D. Thêm secret PROFILE_TOKEN (token cá nhân) nếu muốn tính cả repo private.
      - name: Biểu đồ đóng góp 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./3d-contrib.json

      - name: Vẽ README, ảnh và trang web
        run: npm run build
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets profile-3d-contrib data
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi."
          else
            git commit -m "Vẽ lại profile"
            git push
          fi

      - name: Đăng trang wyattos.cyou
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
