# Dự án nổi bật. size: wide (cả hàng, có ảnh 3D) hoặc half (nửa hàng, hai thẻ nằm cạnh nhau).
# status: open-source | live | release | closed
# show: false để tạm ẩn một dự án mà không phải xoá.
projects:
  - id: checkparking
    title: Check Vehicle OCR
    repo: NovWyatt/checkparking
    link: https://github.com/NovWyatt/checkparking/releases/latest
    size: wide
    image: media/checkparking.png
    icon: phosphor:car-profile
    status: release
    description: >-
      Windows app that reads Vietnamese license plates from photo batches, fully offline
      with PaddleOCR on ONNX Runtime, then exports the results to Excel.
    tags: [Python, PySide6, PaddleOCR, ONNX Runtime, OpenCV]


  - id: tool-win
    title: Trạm Tool
    repo: NovWyatt/Tool_Win
    link: https://github.com/NovWyatt/Tool_Win/releases/latest
    size: wide
    image: media/tool-win.png
    icon: phosphor:toolbox
    status: release
    description: >-
      One local hub for my Windows toolkit: diagnostics, repairs, office and data tools,
      launched and tracked from a browser UI.
    tags: [PowerShell, Python, JavaScript]


  - id: mdf2sql
    title: mdf2sql
    repo: NovWyatt/mdf2sql
    size: half
    icon: phosphor:database
    status: open-source
    description: >-
      Recovers SQL Server data from a bare .mdf file, even after a power cut with no log,
      into a .sql script for SQL Server or MySQL.
    tags: [Python, SQL Server, pyodbc]


  - id: sql-injection-lab
    title: SQL Injection Lab
    repo: NovWyatt/sql-injection-lab
    size: half
    icon: phosphor:bug
    status: open-source
    description: >-
      Teaching lab for SQL injection: a vulnerable and a patched Flask app side by side,
      with exploit scripts for login bypass, UNION and blind SQLi.
    tags: [Python, Flask, SQLite, Security]


  - id: encrypt-decrypt-tool
    title: Encrypt/Decrypt Tool
    repo: NovWyatt/encrypt-decrypt-tool
    link: https://encrypt-decrypt-tool.pages.dev
    size: wide
    image: media/encrypt-decrypt-tool.png
    icon: phosphor:lock-key
    status: live
    description: >-
      AES and RSA for text and files, entirely in the browser with no server.
      Interactive lessons show why ECB leaks an image and CBC does not.
    tags: [TypeScript, React, Web Crypto, Argon2]


  - id: mini-ids
    title: mini-IDS
    repo: NovWyatt/mini-ids
    size: wide
    image: media/mini-ids.png
    icon: phosphor:shield-check
    status: open-source
    description: >-
      Intrusion detection in Python: 12 detectors from port scans to C2 beaconing,
      ML anomaly scoring and a live dashboard mapped to MITRE ATT&CK.
    tags: [Python, Scapy, FastAPI, NumPy]

# Danh sách gọn trong mục "More projects" (thu gọn, bấm để mở).
more:
  - title: KE-TOAN
    repo: NovWyatt/KE-TOAN
    description: Desktop tool for accountants that matches invoices due against bank debit notes in Excel, fully offline.
  - title: Web Brute Force Detection
    repo: NovWyatt/web-brute-force-detection
    description: Flask login that locks IPs and usernames after repeated failures, with an admin dashboard.
  - title: IP Checker
    repo: NovWyatt/IP-Checker
    link: https://ip-checker-phi.vercel.app
    description: Single-page tool that shows your public IP and its details.
  - title: Weather Dashboard
    repo: NovWyatt/WratherMap
    link: https://wrather-map.vercel.app
    description: Forecast dashboard on the OpenWeatherMap API with Chart.js.

# Bàn phím công nghệ. Mỗi hàng có một phím chức năng (row) và các phím icon.
# Phím có thể là tên icon, hoặc { label: "...", icon: "..." } khi muốn đổi chữ trên phím.
stack:
  - row: LANG
    keys:
      - typescript
      - javascript
      - php
      - python
      - { label: "C#", icon: "phosphor:file-c-sharp" }
      - { label: PowerShell, icon: "phosphor:terminal-window" }
  - row: WEB
    keys: [laravel, react, vite, tailwindcss, bootstrap, threedotjs]
  - row: SERVER
    keys:
      - cloudflare
      - hono
      - nodedotjs
      - fastapi
      - flask
      - dotnet
  - row: DATA
    keys:
      - mysql
      - mariadb
      - sqlite
      - { label: SQL Server, icon: "phosphor:database" }
      - opencv
      - onnx
  - row: TOOLS
    keys:
      - git
      - githubactions
      - electron
      - { label: Windows, icon: "phosphor:windows-logo" }
      - linux
      - kalilinux

